##### 0.  Plugin manager #######################################################
set -g @plugin 'tmux-plugins/tpm'

##### 1.  Plugins you’ll actually use  #########################################
set -g @plugin 'tmux-plugins/tmux-sensible'          # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'         # manual save/restore
#set -g @plugin 'tmux-plugins/tmux-continuum'         # autosave every 15 min
set -g @plugin 'tmux-plugins/tmux-yank'              # OSC-52 + remote copy
set -g @plugin 'nhdaly/tmux-better-mouse-mode'       # smooth wheel + select
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # shows when ⌃-b is down
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'dracula/tmux'                        # theme

##### 2.  Terminal capabilities / colours ######################################
set -g default-terminal 'tmux-256color'              # modern terminfo preferred :contentReference[oaicite:0]{index=0}
set -as terminal-features ',*:RGB'                   # advertise 24-bit colour :contentReference[oaicite:1]{index=1}

##### 3.  Clipboard — works on X11 **or** Wayland ##############################
# If wl-copy exists use it, otherwise fall back to xclip.
#if-shell -b 'command -v wl-copy' \
#  "set -s copy-command 'wl-copy'" \
#  "set -s copy-command 'xclip -selection clipboard -in'"
set -g set-clipboard on                              # tmux pipes via copy-command :contentReference[oaicite:2]{index=2}

##### 4.  General Options ######################################################
set -g clock-mode-style    24
set -g history-limit       50000
set -g display-time        4000        # message timeout (ms)
set -g status-interval     5           # refresh status-line faster
set -s escape-time         10          # key-chord latency (ms)
set -g mouse               on
set -g focus-events        on
setw -g aggressive-resize  on

##### 5.  Window titles ########################################################
set -g set-titles on
set -g set-titles-string '[tmux/#{session_name}:#{window_name}] #{?pane_current_command,(#{pane_current_command}),}'

##### 6.  Dracula theme extras #################################################
set -g @dracula-plugins 'cpu-usage ram-usage synchronize-panes '

set -g @dracula-show-powerline true
set -g @dracula-synchronize-panes-colors "pink dark_gray"

set -g @dracula-refresh-rate 0.2

##### 7.  Resurrect / Continuum ################################################
set -g @resurrect-dir          '~/.tmux/resurrect'
#set -g @continuum-save-interval '15'   # minutes
#set -g @continuum-boot          'on'
#set -g @continuum-restore       'on'

##### 8.  Key bindings #########################################################

# New window with same working dir with active pane
bind c new-window -c "#{pane_current_path}"

# Next/Prev window
bind-key -n C-p previous-window
bind-key -n C-n next-window

# Split Pane
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Respawn pane
bind C-l respawn-pane -k -c "#{pane_current_path}"

# Sync panes
bind-key e setw synchronize-panes\; display-message "Sync: #{?pane_synchronized,on,off}"

# Open Folder (cross-platform: macOS uses `open`, Linux uses `xdg-open`)
bind-key o run-shell "if command -v xdg-open > /dev/null 2>&1; then xdg-open '#{pane_current_path}'; else open '#{pane_current_path}'; fi >/dev/null 2>&1"

# Reload
bind-key r source-file ~/.tmux.conf \; display-message 'Config reloaded 🎉'

# Run command in selected panes
bind-key u command-prompt -p "panes (e.g. 0 2):","command:" \
  "run-shell 'for p in %1; do tmux send-keys -t :.\$p \"%2\" C-m; done'"


##### 9.  Mouse fine-tuning (better-mouse-mode) ################################
set -g @better-mouse-scroll-up   3
set -g @better-mouse-scroll-down 3
set -g @yank_highlight_duration  1000   # ms

#set -g @yank_selection_mouse 'primary'
set -g @yank_selection_mouse 'clipboard' # or 'primary' or 'secondary'
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default

set -g allow-passthrough on
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection

# this line changes the default binding of MouseDrag1Pane, the only difference
# is that we use `copy-mode -eM` instead of `copy-mode -M`, so that WheelDownPane
# can trigger copy-mode to exit when copy-mode is entered by MouseDrag1Pane
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= \"#{pane_in_mode}\" \"copy-mode -eM\" \"send-keys -M\"' 'copy-mode -eM'

##
bind-key -T copy-mode-vi Enter send-keys -X cancel
bind-key -T copy-mode Enter send-keys -X cancel

# make Escape exit copy-mode
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode Escape send-keys -X cancel

##### 10. Customize bottom bar ####################################################

set -g status-right '#{?pane_synchronized,#[fg=red]BROADCAST#[default],}'

##### 11. TPM initialisation — keep this last ##################################
run '~/.tmux/plugins/tpm/tpm'
